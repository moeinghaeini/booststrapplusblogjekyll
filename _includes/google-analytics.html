<!-- Google Analytics 4 (gtag.js) -->
{% if site.google_analytics and site.google_analytics != 'G-XXXXXXXXXX' %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}', {
    page_title: '{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}',
    page_location: '{{ page.url | replace:"index.html","" | absolute_url }}',
    custom_map: {
      'custom_parameter_1': 'page_category'
    }
  });

  // Enhanced ecommerce tracking for blog posts
  {% if page.layout == 'post' %}
  gtag('event', 'page_view', {
    page_title: '{{ page.title | escape }}',
    page_location: '{{ page.url | replace:"index.html","" | absolute_url }}',
    content_group1: 'Blog Post',
    content_group2: '{% if page.categories %}{{ page.categories | join: ", " }}{% else %}General{% endif %}',
    custom_parameter_1: '{% if page.tags %}{{ page.tags | join: ", " }}{% else %}No Tags{% endif %}'
  });
  {% endif %}
</script>
{% endif %}
