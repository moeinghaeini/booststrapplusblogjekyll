<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>
    {% if page.title %}{{ page.title | escape }}{{ site.seo.title_separator | default: " | " }}{{ site.title | escape }}
    {% else %}{{ site.title | escape }}{% endif %}
  </title>

  <meta name="description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | normalize_whitespace | truncate: site.seo.description_length | default: 160 | escape }}">
  <meta name="keywords" content="{% if page.keywords %}{{ page.keywords | join: ', ' }}{% else %}web development, bootstrap, jekyll, responsive design, frontend{% endif %}">
  <meta name="author" content="{{ page.author | default: site.author }}">
  <meta name="robots" content="{% if page.noindex %}noindex,nofollow{% else %}index,follow{% endif %}">
  <meta name="language" content="{{ site.lang | default: 'en' }}">

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% elsif page.background %}{{ page.background | absolute_url }}{% else %}{{ site.seo.image | default: '/img/og-image.jpg' | absolute_url }}{% endif %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="{{ site.lang | default: 'en_US' }}">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{ site.twitter_username }}">
  <meta name="twitter:creator" content="@{{ site.twitter_username }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% elsif page.background %}{{ page.background | absolute_url }}{% else %}{{ site.seo.image | default: '/img/og-image.jpg' | absolute_url }}{% endif %}">

  <!-- Article specific meta tags -->
  {% if page.layout == 'post' %}
  <meta property="article:author" content="{{ page.author | default: site.author }}">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:modified_time" content="{{ page.last_modified_at | default: page.date | date_to_xmlschema }}">
  {% if page.categories %}{% for category in page.categories %}
  <meta property="article:section" content="{{ category }}">
  {% endfor %}{% endif %}
  {% if page.tags %}{% for tag in page.tags %}
  <meta property="article:tag" content="{{ tag }}">
  {% endfor %}{% endif %}
  {% endif %}

  <!-- Favicon and Touch Icons -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://use.fontawesome.com">

  <!-- Fonts with display=swap for better performance -->
  <link href='https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap' rel='stylesheet'>

  <!-- Font Awesome with integrity check -->
  <script src="https://use.fontawesome.com/releases/v5.15.3/js/all.js" crossorigin="anonymous" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  
  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{% if page.layout == 'post' %}BlogPosting{% else %}WebSite{% endif %}",
    "headline": "{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}",
    "description": "{{ page.excerpt | default: page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}",
    "url": "{{ page.url | replace:'index.html','' | absolute_url }}",
    "author": {
      "@type": "Person",
      "name": "{{ page.author | default: site.author }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ site.title }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ '/img/logo.png' | absolute_url }}"
      }
    },
    "datePublished": "{% if page.layout == 'post' %}{{ page.date | date_to_xmlschema }}{% else %}{{ site.time | date_to_xmlschema }}{% endif %}",
    "dateModified": "{% if page.layout == 'post' %}{{ page.last_modified_at | default: page.date | date_to_xmlschema }}{% else %}{{ site.time | date_to_xmlschema }}{% endif %}",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | replace:'index.html','' | absolute_url }}"
    }
    {% if page.image or page.background %},
    "image": {
      "@type": "ImageObject",
      "url": "{% if page.image %}{{ page.image | absolute_url }}{% elsif page.background %}{{ page.background | absolute_url }}{% else %}{{ site.seo.image | default: '/img/og-image.jpg' | absolute_url }}{% endif %}"
    }
    {% endif %}
  }
  </script>

</head>
